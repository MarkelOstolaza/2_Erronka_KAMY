                                <img src="Img/fantasma.jpg" alt="" width="60" height="90" style="border-radius:6px;">
                                <div>
                                    <div style="font-size:1.1rem;color:white;">Un fantasma en la batalla</div>
                                    <div style="color:rgba(255,255,255,0.7);font-size:0.9rem;">Sarrera x2</div>
                                </div>
                            </div>
                        </td>
                        <td style="padding:12px;">€6.50</td>
                        <td style="padding:12px;">2</td>
                        <td style="padding:12px;">€13.00</td>
                    </tr>
                    <tr style="border-bottom:1px solid rgba(255,255,255,0.05);">

                                <img src="Img/elixir.jpg" alt="" width="60" height="90" style="border-radius:6px;">

                                    <div style="font-size:1.1rem;color:white;">The elixir</div>
                                    <div style="color:rgba(255,255,255,0.7);font-size:0.9rem;">Sarrera x1</div>
                                </div>
                            </div>
                        </td>
                        <td style="padding:12px;">€6.50</td>
                        <td style="padding:12px;">1</td>
                        <td style="padding:12px;">€6.50</td>
                    </tr>
                </tbody>

            <div style="display:flex;justify-content:flex-end;margin-top:20px;gap:20px;align-items:center;">
                <div style="text-align:right;color:white;font-size:1.1rem;">
                    <div>Subtotala: €26.00</div>
                    <div>BEZ: €4.54</div>
                    <div style="font-weight:700;font-size:1.2rem;margin-top:6px;">Guztira: €30.54</div>

                <div>
                    <button onclick="pagatu()" style="background:#27ae60;color:white;padding:12px 20px;border-radius:8px;border:none;cursor:pointer;font-size:1rem;">Ordaindu</button>
